
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREF GON - Gestion des Marchés Publics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #error-overlay { display: none; position: fixed; inset: 0; background: white; z-index: 9999; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .error-card { max-width: 500px; padding: 2rem; border: 1px solid #fee2e2; border-radius: 1rem; background: #fef2f2; }
    </style>
    <script>
        // SHIM: Définit process.env pour éviter les ReferenceError avec les SDK (Gemini/Supabase)
        window.process = { env: { API_KEY: "" } }; 
        
        // GLOBAL ERROR CATCHER: Capture les erreurs de chargement de module ou syntaxe
        window.onerror = function(msg, url, line, col, error) {
            const overlay = document.getElementById('error-overlay');
            if (overlay) {
                overlay.style.display = 'flex';
                document.getElementById('error-msg').textContent = msg;
            }
            return false;
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <!-- UI de secours en cas de crash critique du JS -->
    <div id="error-overlay" style="display:none;">
        <div class="error-card">
            <h1 style="color:#991b1b; font-weight:900; margin-bottom:1rem;">ERREUR D'INITIALISATION</h1>
            <p style="color:#b91c1c; font-size:0.875rem;" id="error-msg">Une erreur critique est survenue lors du chargement de l'application.</p>
            <button onclick="window.location.reload()" style="margin-top:1.5rem; background:#1e3a8a; color:white; padding:0.5rem 1rem; border-radius:0.5rem; font-size:0.75rem; font-weight:bold;">RÉESSAYER</button>
        </div>
    </div>
</body>
</html>
